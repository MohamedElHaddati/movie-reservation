{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-xl rounded-2xl border border-emerald-200 bg-white p-8 text-center shadow-sm">
  <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-emerald-100 text-emerald-700">
    ✓
  </div>
  <h1 class="text-2xl font-bold text-slate-900">Reservation confirmed</h1>
  <p class="mt-2 text-sm text-slate-600">Your reservation has been processed successfully.</p>
  <div class="mt-6 space-y-2 rounded-xl bg-slate-50 p-4 text-sm">
    <p><span class="font-medium text-slate-700">Reservation ID:</span> {{ reservation.id }}</p>
    <p><span class="font-medium text-slate-700">Status:</span> {{ reservation.status }}</p>
  </div>
  <div class="mt-6 flex flex-col justify-center gap-3 sm:flex-row">
    <a
      href="/reservations/{{ reservation.id }}/"
      class="inline-flex rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:text-slate-900"
    >
      Reservation details
    </a>
    <a
      href="/reservations/{{ reservation.id }}/ticket/"
      class="inline-flex rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-500"
    >
      View ticket
    </a>
    <a
      href="/"
      class="inline-flex rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-500"
    >
      Back to movies
    </a>
  </div>
</div>
{% endblock %}
