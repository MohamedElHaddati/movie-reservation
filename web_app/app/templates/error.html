{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-2xl rounded-2xl border border-amber-200 bg-white p-8 shadow-sm">
  <h1 class="text-2xl font-bold text-slate-900">{{ error_title|default:"Something went wrong" }}</h1>
  <p class="mt-3 text-sm text-slate-600">
    {{ error_message|default:"Please try again in a moment." }}
  </p>
  <div class="mt-6">
    {% if request.session.access_token %}
    <a
      href="/"
      class="inline-flex rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-500"
    >
      Back to movies
    </a>
    {% else %}
    <a
      href="/login/"
      class="inline-flex rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-500"
    >
      Back to login
    </a>
    {% endif %}
  </div>
</div>
{% endblock %}
