{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="text-2xl font-bold text-slate-900">Welcome back</h1>
  <p class="mt-2 text-sm text-slate-600">Sign in to reserve your seats.</p>

  {% if error_message %}
  <div class="mt-4 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">
    {{ error_message }}
  </div>
  {% endif %}

  <form method="post" class="mt-6 space-y-4">
    {% csrf_token %}
    <div>
      <label for="username" class="mb-1 block text-sm font-medium text-slate-700">Username</label>
      <input
        id="username"
        name="username"
        value="{{ username|default:'' }}"
        required
        class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
      />
    </div>
    <div>
      <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        required
        class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
      />
    </div>
    <button
      type="submit"
      class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-500"
    >
      Login
    </button>
  </form>
  <p class="mt-5 text-center text-sm text-slate-600">
    No account yet?
    <a href="/register/" class="font-semibold text-indigo-600 hover:text-indigo-500">Create one</a>
  </p>
</div>
{% endblock %}
