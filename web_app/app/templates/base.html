<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineBook</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <div class="mx-auto max-w-5xl px-4 py-8 sm:px-6 lg:px-8">
    {% if show_nav|default:True %}
    <div class="mb-8 rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-sm">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-lg font-semibold text-slate-900">CineBook</span>
          {% if request.session.username %}
          <span class="rounded-full bg-indigo-50 px-2.5 py-1 text-xs font-medium text-indigo-700">
            {{ request.session.username }}
          </span>
          {% endif %}
        </div>
        <div class="flex items-center gap-4 text-sm">
          <a href="/" class="font-medium text-slate-700 hover:text-indigo-600">Movies</a>
          <a href="/reservations/" class="font-medium text-slate-700 hover:text-indigo-600">My reservations</a>
          <a href="/logout/" class="font-medium text-slate-700 hover:text-rose-600">Logout</a>
        </div>
      </div>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
