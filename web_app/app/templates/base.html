<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineBook</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .container { max-width: 960px; margin: 0 auto; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .seat { display: inline-block; margin: 4px; padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; }
    .seat.taken { background: #f8d7da; border-color: #f5c2c7; color: #842029; }
    .seat.available { background: #d1e7dd; border-color: #badbcc; color: #0f5132; }
    .nav { margin-bottom: 16px; }
    .nav a { margin-right: 12px; }
    button { padding: 8px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="/">Movies</a>
      <a href="/logout/">Logout</a>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
