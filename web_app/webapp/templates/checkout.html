{% extends "base.html" %}
{% block content %}
<h2>Checkout</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <input type="hidden" name="showtime_id" value="{{ showtime_id }}" />
  {% for seat_id in seat_ids %}
    <input type="hidden" name="seat_ids" value="{{ seat_id }}" />
  {% endfor %}
  <p>Showtime: {{ showtime_id }}</p>
  <p>Seats: {{ seat_ids|join:", " }}</p>
  <label>User ID <input type="text" name="user_id" value="client-001" required /></label><br/><br/>
  <label>Email <input type="email" name="user_email" value="client@cinebook.local" required /></label><br/><br/>
  <button type="submit">Reserve and confirm</button>
</form>
{% endblock %}
